name: CD Backend

on:
  push:
    branches: [main]
    paths:
      - 'kredibble-backend/**'
      - 'deploy/**'
      - 'scripts/smoke.mjs'
      - '.nvmrc'
      - '.github/workflows/cd-backend.yml'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to deploy or rollback to (defaults to trigger SHA)'
        required: false
        default: ''
      target_env:
        description: 'Target environment for manual deployment'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - staging
          - production

# Never run two deploys of the backend at once; let an in-flight one finish.
concurrency:
  group: cd-backend
  cancel-in-progress: false

permissions:
  contents: read

env:
  MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries

jobs:
  verify:
    name: Verify (lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kredibble-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: kredibble-backend/package-lock.json
      - uses: actions/cache@v6
        with:
          path: .mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('kredibble-backend/package-lock.json') }}
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm test -- --ci

  image:
    name: Build and push image (GHCR)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      release_sha: ${{ steps.resolve.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v7
      - id: resolve
        run: |
          TARGET_SHA="${{ inputs.sha }}"
          if [ -z "$TARGET_SHA" ]; then
            TARGET_SHA="${{ github.sha }}"
          fi
          echo "release_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Target Release SHA: $TARGET_SHA"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # metadata-action lowercases the image name; GHCR rejects mixed-case repository names.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/kredibble-backend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.resolve.outputs.release_sha }}
      - uses: docker/build-push-action@v7
        with:
          context: kredibble-backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_SHA=${{ steps.resolve.outputs.release_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging (VPS)
    needs: [verify, image]
    if: inputs.target_env != 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A missing secret fails the run. It used to print a notice and exit 0,
      # which left CD green while nothing was deployed (10 Nov 2026).
      - name: Deploy to VPS staging via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ needs.image.outputs.release_sha }}
        run: |
          missing=""
          [ -n "$VPS_HOST" ] || missing="$missing VPS_HOST"
          [ -n "$VPS_SSH_KEY" ] || missing="$missing VPS_SSH_KEY"
          [ -n "$VPS_KNOWN_HOSTS" ] || missing="$missing VPS_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error title=Staging VPS deploy not run::Missing repository secrets:$missing. Nothing was deployed. Add them under Settings > Secrets and variables > Actions (see docs/infrastructure/VPS.md), then re-run this workflow."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Secrets pasted on Windows can end in a carriage return, which breaks
          # both the host name and the host key line. Strip it.
          host=$(printf '%s' "$VPS_HOST" | tr -d '\r\n\t ')
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! ssh-keygen -F "$host" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error title=VPS_KNOWN_HOSTS does not match VPS_HOST::VPS_KNOWN_HOSTS has no key for the host in VPS_HOST. Each line must start with exactly the VPS_HOST value; regenerate it with ssh-keyscan -t ed25519 and the VPS_HOST value. The fingerprints it holds are listed below."
            # Fingerprints and key types only: never print host names (SEC-140).
            ssh-keygen -lf ~/.ssh/known_hosts | awk '{ print $2, $NF }' || echo "No valid key lines in VPS_KNOWN_HOSTS."
            exit 1
          fi
          eval "$(ssh-agent -s)"
          echo "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@"$host" "deploy staging $RELEASE_SHA"

  smoke-staging:
    name: Smoke test (Staging)
    needs: [image, deploy-staging]
    if: inputs.target_env != 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Run smoke test against Staging API
        env:
          RELEASE_SHA: ${{ needs.image.outputs.release_sha }}
        run: |
          node scripts/smoke.mjs "https://staging-api.globalopportunitydesk.com" "$RELEASE_SHA" "staging"

  deploy-production:
    name: Deploy to Production (VPS)
    needs: [image, smoke-staging]
    # Production needs a passing staging smoke test, unless this is a manual
    # production-only run. A failed staging deploy SKIPS the smoke test, so
    # "skipped" must not count as a pass here.
    if: always() && needs.image.result == 'success' && inputs.target_env != 'staging' && (needs.smoke-staging.result == 'success' || inputs.target_env == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - name: Deploy to VPS production via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ needs.image.outputs.release_sha }}
        run: |
          missing=""
          [ -n "$VPS_HOST" ] || missing="$missing VPS_HOST"
          [ -n "$VPS_SSH_KEY" ] || missing="$missing VPS_SSH_KEY"
          [ -n "$VPS_KNOWN_HOSTS" ] || missing="$missing VPS_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error title=Production VPS deploy not run::Missing repository secrets:$missing. Nothing was deployed. Add them under Settings > Secrets and variables > Actions (see docs/infrastructure/VPS.md), then re-run this workflow."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          host=$(printf '%s' "$VPS_HOST" | tr -d '\r\n\t ')
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! ssh-keygen -F "$host" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error title=VPS_KNOWN_HOSTS does not match VPS_HOST::VPS_KNOWN_HOSTS has no key for the host in VPS_HOST. Each line must start with exactly the VPS_HOST value; regenerate it with ssh-keyscan -t ed25519 and the VPS_HOST value. The fingerprints it holds are listed below."
            ssh-keygen -lf ~/.ssh/known_hosts | awk '{ print $2, $NF }' || echo "No valid key lines in VPS_KNOWN_HOSTS."
            exit 1
          fi
          eval "$(ssh-agent -s)"
          echo "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@"$host" "deploy production $RELEASE_SHA"

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Run smoke test against Production API
        env:
          RELEASE_SHA: ${{ needs.image.outputs.release_sha }}
        run: |
          node scripts/smoke.mjs "https://api.globalopportunitydesk.com" "$RELEASE_SHA" "production"

  deploy-render:
    name: Trigger Render deploy (Transition)
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # A warning, not a failure: Render is the old host being retired, and
          # its own GitHub auto-deploy can still deploy main without the hook.
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning title=Render deploy not triggered::RENDER_DEPLOY_HOOK_URL is not set, so this run did not deploy to Render. Render's own GitHub auto-deploy (if enabled) still deploys main."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Render deploy triggered."
