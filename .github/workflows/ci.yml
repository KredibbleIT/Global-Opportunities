name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

# One run per ref; a newer push to the same PR cancels the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # mongodb-memory-server downloads mongod here (gitignored) so it can be cached.
  MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries

jobs:
  backend:
    name: Backend (lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kredibble-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: kredibble-backend/package-lock.json
      - name: Cache MongoDB binaries (mongodb-memory-server)
        uses: actions/cache@v6
        with:
          path: .mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('kredibble-backend/package-lock.json') }}
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm test -- --ci
      - name: Production boot smoke test (SEC-068)
        run: |
          NODE_ENV=production \
          DATABASE_URL="mongodb://127.0.0.1:27017/kredibble" \
          JWT_SECRET="012345678901234567890123456789012345678901234567" \
          ADMIN_JWT_SECRET="abcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdef" \
          CORS_ORIGIN="https://admin.kredibble.com,https://app.kredibble.com" \
          PORT=4000 \
          node -e "import('./src/config/env.js').then(() => console.log('Boot smoke test passed!'))"

  backend-image:
    name: Backend (Docker image builds)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: kredibble-backend
          push: false
          tags: kredibble-backend:ci
          build-args: |
            RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  admin:
    name: Admin (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kredibble-admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: kredibble-admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Same shape as the deployed config: same-origin proxy to the API.
          NEXT_PUBLIC_API_URL: /api
          API_PROXY_TARGET: https://kredibble-api.onrender.com/api

  admin-e2e:
    name: Admin (Playwright end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 30  # two Playwright runs (real API + mock mode)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            kredibble-backend/package-lock.json
            kredibble-admin/package-lock.json
      - name: Cache MongoDB binaries (mongodb-memory-server)
        uses: actions/cache@v6
        with:
          path: .mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('kredibble-backend/package-lock.json') }}
      - name: Install backend (serves the API for the suite)
        run: npm ci --legacy-peer-deps
        working-directory: kredibble-backend
      - name: Install admin
        run: npm ci
        working-directory: kredibble-admin
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: kredibble-admin
      # A throwaway admin for this run: the in-memory API seeds it and the tests sign in with it. The password is
      # random per run and masked, so nothing secret is stored in the repository.
      - name: Create throwaway e2e admin credentials
        run: |
          PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$PASSWORD"
          echo "E2E_ADMIN_EMAIL=ci-admin@example.com" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      # playwright.config.ts starts the in-memory API and the admin dev server itself.
      # Two runs (tests/mode.ts): against the real API (what ships), then with NEXT_PUBLIC_USE_MOCKS=true on port 3100
      # for the checks that need mock records, the mock store or the dev-only ?state= switch.
      - name: Run Playwright (real API)
        run: npx playwright test
        working-directory: kredibble-admin
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Run Playwright (mock mode)
        run: npx playwright test
        working-directory: kredibble-admin
        env:
          NEXT_TELEMETRY_DISABLED: 1
          E2E_MOCKS: '1'
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: kredibble-admin/playwright-report/
          retention-days: 14

  app:
    name: Mobile app (lint, typecheck, test, bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kredibble-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: kredibble-app/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - name: Bundle check (Metro export)
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-export"
        env:
          EXPO_NO_TELEMETRY: 1
          EXPO_PUBLIC_API_URL: https://kredibble-api.onrender.com/api

  hygiene:
    name: Repo hygiene (encoding, workflows, shell, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Encoding check tests
        run: node --test scripts/check-encoding.test.mjs
      - name: Deploy gate tests
        run: node --test deploy/bin/god-deploy-gate.test.mjs
      - name: Smoke test suite
        run: node --test scripts/smoke.test.mjs
      # SEC-110: UTF-16 workflow files are rejected by GitHub; Windows-1252 destroys task.md.
      - name: Text files are UTF-8
        run: node scripts/check-encoding.mjs
      # actionlint also runs shellcheck on every run: block.
      - name: Lint workflows
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - name: Lint shell scripts
        run: git ls-files -z '*.sh' 'deploy/bin/god-deploy' 'deploy/bin/god-deploy-gate' | xargs -0 --no-run-if-empty shellcheck
      # Working tree only. A one-off full-history scan is part of Plan 4 track M1.
      - name: Scan for committed secrets
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" --workdir /repo ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo -i /repo/.gitleaksignore -v --redact --no-banner

