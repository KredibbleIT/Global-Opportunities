name: CD App

on:
  push:
    branches: [main]
    paths:
      - 'kredibble-app/**'
      - '.nvmrc'
      - '.github/workflows/cd-app.yml'
  workflow_dispatch:
    inputs:
      target_channel:
        description: 'Target EAS channel to publish to'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - staging
          - production

concurrency:
  group: cd-app
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify (lint, typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kredibble-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: kredibble-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci

  build-android-store:
    name: Build Android Store (AAB)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: kredibble-app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: 1
      EAS_BUILD_NO_EXPO_GO_WARNING: true
    steps:
      - uses: actions/checkout@v7
      - name: Check Expo token
        id: creds
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice title=Android store build skipped::Set the EXPO_TOKEN repository secret to build store artifacts."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: kredibble-app/package-lock.json
      - if: steps.creds.outputs.ready == 'true'
        run: npm ci
      - if: steps.creds.outputs.ready == 'true'
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
      - if: steps.creds.outputs.ready == 'true'
        name: Build Android production AAB
        run: |
          eas build --platform android --profile production --non-interactive

  submit-android:
    name: Submit Android to Play Store
    needs: [verify, build-android-store]
    if: always() && needs.verify.result == 'success' && needs.build-android-store.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
    defaults:
      run:
        working-directory: kredibble-app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v7
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$EXPO_TOKEN" ] || [ -z "$EAS_CREDENTIALS_JSON" ]; then
            echo "::notice title=Play Store submit skipped::Set EXPO_TOKEN and GOOGLE_PLAY_SERVICE_ACCOUNT_JSON repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: kredibble-app/package-lock.json
      - if: steps.creds.outputs.ready == 'true'
        run: npm ci
      - if: steps.creds.outputs.ready == 'true'
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
      - if: steps.creds.outputs.ready == 'true'
        name: Configure Play Store credentials
        run: |
          echo "HOME=$HOME"
          mkdir -p ~/.eas
          node -e '
            const fs = require("fs");
            const parsed = JSON.parse(process.env.EAS_CREDENTIALS_JSON);
            const creds = parsed && parsed.google_play ? parsed : { google_play: { serviceAccountKey: parsed } };
            const dir = process.env.HOME + "/.eas";
            fs.mkdirSync(dir, { recursive: true });
            const path = dir + "/credentials.json";
            fs.writeFileSync(path, JSON.stringify(creds, null, 2));
            console.log("wrote Play credentials to", path);
          '
          ls -la ~/.eas/credentials.json
      - if: steps.creds.outputs.ready == 'true'
        name: Submit to Play Store
        run: |
          eas credentials:google-play --non-interactive
          eas submit --platform android --latest --non-interactive

  publish-staging:
    name: Publish EAS Update (Staging)
    needs: verify
    if: inputs.target_channel != 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: kredibble-app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Check Expo token
        id: creds
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice title=EAS staging update skipped::Set the EXPO_TOKEN repository secret to publish app updates."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: kredibble-app/package-lock.json
      - if: steps.creds.outputs.ready == 'true'
        run: npm ci
      - if: steps.creds.outputs.ready == 'true'
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
      - if: steps.creds.outputs.ready == 'true'
        name: Publish staging update
        run: |
          EXPO_PUBLIC_API_URL=$(node -p "require('./eas.json').build['staging'].env.EXPO_PUBLIC_API_URL")
          export EXPO_PUBLIC_API_URL
          echo "EXPO_PUBLIC_API_URL=$EXPO_PUBLIC_API_URL"
          eas update --channel staging --platform all --message "$(git log -1 --pretty=%s) (${GITHUB_SHA::7})" --non-interactive

  publish-production:
    name: Publish EAS Update (Production)
    needs: [verify, publish-staging]
    if: always() && needs.verify.result == 'success' && (needs.publish-staging.result == 'success' || needs.publish-staging.result == 'skipped') && inputs.target_channel != 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: Production
    defaults:
      run:
        working-directory: kredibble-app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Check Expo token
        id: creds
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice title=EAS production update skipped::Set the EXPO_TOKEN repository secret to publish app updates."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: kredibble-app/package-lock.json
      - if: steps.creds.outputs.ready == 'true'
        run: npm ci
      - if: steps.creds.outputs.ready == 'true'
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
      - if: steps.creds.outputs.ready == 'true'
        name: Publish production update
        run: |
          EXPO_PUBLIC_API_URL=$(node -p "require('./eas.json').build['production'].env.EXPO_PUBLIC_API_URL")
          export EXPO_PUBLIC_API_URL
          echo "EXPO_PUBLIC_API_URL=$EXPO_PUBLIC_API_URL"
          eas update --channel production --platform all --message "$(git log -1 --pretty=%s) (${GITHUB_SHA::7})" --non-interactive
