name: CD Admin

on:
  push:
    branches: [main]
    paths:
      - 'kredibble-admin/**'
      - '.nvmrc'
      - '.github/workflows/cd-admin.yml'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target deployment environment'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - staging
          - production

concurrency:
  group: cd-admin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify (lint, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kredibble-admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: kredibble-admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Verify production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: /api
          API_PROXY_TARGET: https://api.globalopportunitydesk.com/api

  deploy-staging:
    name: Deploy to Staging (Vercel)
    needs: verify
    if: inputs.target_env != 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Run from the repo root: the Vercel project's Root Directory is
    # kredibble-admin, so the CLI inside that folder looks for kredibble-admin/kredibble-admin.
    defaults:
      run:
        working-directory: .
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      # A missing secret fails the run instead of skipping it with a green tick.
      - name: Check Vercel credentials
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Admin staging deploy not run::Missing repository secrets:$missing. Nothing was deployed. Add them under Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
        working-directory: .
      - uses: actions/checkout@v7
      - name: Check Vercel can open the project
        run: bash scripts/vercel-preflight.sh
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: kredibble-admin/package-lock.json
      - run: npm install --global vercel@59
        working-directory: .
      - run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - run: vercel build --token="$VERCEL_TOKEN"
      - id: deploy-staging
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Staging deployed: $url"

  deploy-production:
    name: Deploy to Production (Vercel)
    needs: [verify, deploy-staging]
    if: always() && needs.verify.result == 'success' && (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped') && inputs.target_env != 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production
    # Run from the repo root: the Vercel project's Root Directory is
    # kredibble-admin, so the CLI inside that folder looks for kredibble-admin/kredibble-admin.
    defaults:
      run:
        working-directory: .
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      # A missing secret fails the run instead of skipping it with a green tick.
      - name: Check Vercel credentials
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Admin production deploy not run::Missing repository secrets:$missing. Nothing was deployed. Add them under Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
        working-directory: .
      - uses: actions/checkout@v7
      - name: Check Vercel can open the project
        run: bash scripts/vercel-preflight.sh
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: kredibble-admin/package-lock.json
      - run: npm install --global vercel@59
        working-directory: .
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - id: deploy-prod
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployed: $url"
